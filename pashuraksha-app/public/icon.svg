<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PashuRaksha">
  <!-- Outbreak-cluster mark: the same concentric ring the map draws over a
       detected DBSCAN cluster, so the app icon and the data share a motif.
       All content sits inside the central 60% so Android's maskable crop
       (which can shave up to 20% off each edge) never clips it. -->
  <rect width="512" height="512" rx="112" fill="#161625"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ff073a" stroke-width="10" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#ff073a" stroke-width="12" stroke-opacity="0.45"
          stroke-dasharray="26 18" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="72" fill="#ff073a" fill-opacity="0.16"/>
  <circle cx="256" cy="256" r="72" fill="none" stroke="#ff073a" stroke-width="14"/>
  <circle cx="256" cy="256" r="26" fill="#ff073a"/>
</svg>
